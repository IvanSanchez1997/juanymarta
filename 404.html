<title>Juan & Marta · 11 Octubre 2026</title>
<!--
  Página de error de GitHub Pages.

  Existe por un motivo concreto: /galeria se sirve como
  /galeria/ y GitHubPages redirige /galeria -> /galeria/ con un 301.
  Esa redirección NO la sigue un <meta refresh>, así que sin este
  fichero el enlace "Ver galería completa" se vería en un 404 real.

  El refresh solo actúa si la URL es /galeria o /galeria/ (a secas,
  o con un subcamino que no exista). Con cualquier otro nombre
  devuelve un 404 de verdad, que es lo que debe pasar.
-->
<meta http-equiv="refresh" content="0; url=/galeria/">
<link rel="canonical" href="https://juanymarta.com/galeria/">
<style>
html { background: #ddd5cc; }
body {
  width: 390px; margin: 0 auto; min-height: 100vh;
  background: #fefcf8; color: #5a4535;
  font-family: Georgia, serif;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 30px;
}
</style>
</head>
<body>
<p>Te llevamos a la galer&iacute;a&hellip;</p>
</body>
</html>
